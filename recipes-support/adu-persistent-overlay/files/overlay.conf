# ADU Persistent Overlay Configuration
# This file controls which directories use overlayfs and which files use bind mounts

# Base directory for all persistent data
PERSIST_BASE="/adu"

# Overlay base directory (upper layers)
OVERLAY_BASE="${PERSIST_BASE}/overlay"

# Work directory for overlayfs
WORK_BASE="${PERSIST_BASE}/work"

# System directory for critical bind mounts
SYSTEM_DIR="${PERSIST_BASE}/system"

# Directories to overlay (overlayfs applied to these paths)
# Format: one directory per line, absolute paths
# NOTE: /etc is excluded because bind mounts for passwd/shadow would conflict
#       Use bind mounts for specific /etc files instead
# NOTE: /var/lib/apt is excluded to avoid conflicts with /etc/apt bind mounts
#       during atomic APT updates
OVERLAY_DIRS=(
    "/var/log"
    "/var/lib/connman"
    "/var/lib/bluetooth"
    "/var/cache/apt"
    "/var/lib/adu"
    "/var/lib/adu/downloads"
    "/var/lib/adu/extensions"
    "/var/lib/adu/states"
    "/var/lib/adu/sdc"
    "/var/lib/adu/api"
)

# Critical files to bind mount (takes precedence over overlay)
# Format: source_file:target_file (relative to SYSTEM_DIR for source)
# Supports both files and directories - directories will be bind mounted recursively
BIND_MOUNTS=(
    "passwd:/etc/passwd"
    "shadow:/etc/shadow"
    "group:/etc/group"
    "gshadow:/etc/gshadow"
    "hostname:/etc/hostname"
    "timezone:/etc/timezone"
    "machine-id:/etc/machine-id"
    "du-config.json:/etc/adu/du-config.json"
    "ssh:/etc/ssh"
    "apt-sources.list.d:/etc/apt/sources.list.d"
    "apt-trusted.gpg.d:/etc/apt/trusted.gpg.d"
    "apt-preferences.d:/etc/apt/preferences.d"
)

# Enable migration on first boot
AUTO_MIGRATE="yes"

# Enable verification after mount
VERIFY_MOUNTS="yes"
