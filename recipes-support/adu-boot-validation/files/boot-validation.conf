# ADU Boot Validation Configuration
#
# This file configures the boot validation service that runs after
# A/B partition updates to verify the new system is working correctly.

[General]
# Maximum time (in seconds) to wait for validation to complete
ValidationTimeout=300

# Allow manual override with adu-confirm-boot command
AllowManualOverride=true

# Automatically confirm boot if validation times out (not recommended)
AutoConfirmOnTimeout=false

[Checks]
# Enable/disable built-in checks
# Values: critical, warning, disabled
CheckSystemdServices=critical
CheckFilesystemWritable=critical
CheckVersionMatch=critical
CheckAduAgent=warning
CheckNetworkConnectivity=warning
CheckDiskSpace=warning

# Directory for custom validation check scripts
CustomChecksDir=/usr/lib/adu/validation-checks.d

[SystemdServices]
# Comma-separated list of critical systemd services to check
# These services must be active for validation to pass
Services=systemd-journald,dbus,systemd-logind

[DiskSpace]
# Minimum free disk space in MB
MinimumFreeMB=100
