# WiFi/Bluetooth support for Raspberry Pi 4
# This configuration enables the onboard BCM43455 WiFi/Bluetooth chip
#
# WARNING: Enabling this feature requires accepting the proprietary
# "synaptics-killswitch" license for the BCM43455 firmware.
#
# This is disabled by default to ensure explicit consent for
# proprietary firmware licensing.

ENABLE_WIFI_BLUETOOTH ?= "0"

# Kernel command line configuration for ADU
# Remove quiet and splash to show boot messages and disable Plymouth
CMDLINE:remove = "quiet splash"
CMDLINE:append = " plymouth.enable=0"

# When enabled, accept the required proprietary firmware license
LICENSE_FLAGS_ACCEPTED:append = "${@' synaptics-killswitch' if d.getVar('ENABLE_WIFI_BLUETOOTH') == '1' else ''}"

# When disabled (default), remove WiFi/Bluetooth hardware features
# This prevents packagegroup-base-extended from pulling in the firmware
MACHINE_FEATURES:remove = "${@'' if d.getVar('ENABLE_WIFI_BLUETOOTH') == '1' else 'wifi bluetooth'}"

# When disabled, remove packagegroup-base-extended which has hard dependency on BCM43455 firmware
IMAGE_INSTALL:remove = "${@'' if d.getVar('ENABLE_WIFI_BLUETOOTH') == '1' else 'packagegroup-base-extended'}"
