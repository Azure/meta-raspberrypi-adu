# Ensure /var/lib/adu/states directory exists at boot for adu-boot-validator
# This directory stores boot validation state and rollback tracking
#
# q - Create the directory at boot if it does not exist
#   For more details see 'man tmpfiles.d'
# 0770 - rwxrwx--- Owner and group have full access, others no access
# adu adu - Owner and group for the folder
# - - No age-based cleanup (state must persist)
#
# Type  Path                     Mode  Owner  Group  Age  Argument
q      /var/lib/adu/states       0770  adu    adu    -    -
